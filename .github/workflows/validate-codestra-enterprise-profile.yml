name: Validate Codestra Tempo corporate configuration

on:
  pull_request:
    paths:
      - 'codestra/**'
      - 'scripts/validate_codestra_enterprise_profile.py'
      - 'scripts/validate_codestra_corporate_tempo.py'
      - 'scripts/validate_codestra_profile_privacy.py'
      - '.github/workflows/validate-codestra-enterprise-profile.yml'
      - 'upstream/go.mod'
      - 'upstream/go.sum'
  push:
    branches: [development, test, staging, production, main]
    paths:
      - 'codestra/**'
      - 'scripts/validate_codestra_enterprise_profile.py'
      - 'scripts/validate_codestra_corporate_tempo.py'
      - 'scripts/validate_codestra_profile_privacy.py'
      - '.github/workflows/validate-codestra-enterprise-profile.yml'
      - 'upstream/go.mod'
      - 'upstream/go.sum'

permissions:
  contents: read

concurrency:
  group: codestra-tempo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install pinned validator dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Validate Codestra profile, tenants, privacy, packaging, and runtime policy
        env:
          PYTHONPYCACHEPREFIX: /tmp/codestra-tempo-pycache
        run: |
          python -m py_compile \
            scripts/validate_codestra_enterprise_profile.py \
            scripts/validate_codestra_corporate_tempo.py \
            scripts/validate_codestra_profile_privacy.py
          python scripts/validate_codestra_profile_privacy.py
          python scripts/validate_codestra_corporate_tempo.py

      - name: Render hardened Compose candidate
        env:
          CODESTRA_TEMPO_IMAGE: ghcr.io/appolon1908-hue/codestra-tempo:ci@sha256:2222222222222222222222222222222222222222222222222222222222222222
          CODESTRA_ENVIRONMENT: test
          CODESTRA_REGION: ci
          CODESTRA_DEPLOYMENT_ID: exact-head-ci
          CODESTRA_SOURCE_SHA: 0000000000000000000000000000000000000000
          CODESTRA_IMAGE_DIGEST: sha256:2222222222222222222222222222222222222222222222222222222222222222
          TEMPO_S3_ENDPOINT: s3.internal.example:443
          TEMPO_S3_BUCKET: codestra-tempo-ci
          TEMPO_S3_REGION: us-east-1
          TEMPO_S3_INSECURE: 'false'
          TEMPO_MEMCACHED_ADDRESSES: dns+memcached:11211
          TEMPO_PROMETHEUS_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
          TEMPO_QUERY_HOST_PORT: '3200'
          TEMPO_S3_CREDENTIALS_FILE: /tmp/tempo-s3-credentials
          TEMPO_S3_CA_FILE: /tmp/tempo-s3-ca.pem
        run: |
          python -c "import scripts.validate_codestra_enterprise_profile as v; v.validate_runtime_image_environment()"
          docker compose -f codestra/deploy/compose.candidate.yaml config > /tmp/codestra-tempo-compose.yaml
          test -s /tmp/codestra-tempo-compose.yaml
          grep -Eq 'host_ip:[[:space:]]*127\.0\.0\.1' /tmp/codestra-tempo-compose.yaml
          ! grep -Eq 'host_ip:[[:space:]]*(0\.0\.0\.0|::)|:latest([[:space:]]|$)|privileged: true|/var/run/docker\.sock' /tmp/codestra-tempo-compose.yaml

      - name: Set up Go from locked upstream source
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum

      - name: Compile and vet native readiness probe
        run: |
          test -z "$(gofmt -d codestra/deploy/healthcheck.go)"
          go vet codestra/deploy/healthcheck.go
          CGO_ENABLED=0 go build -trimpath -o /tmp/tempo-healthcheck codestra/deploy/healthcheck.go

      - name: Build Tempo verifier from locked source
        working-directory: upstream
        run: |
          mkdir -p ../.bin
          go build -trimpath -o ../.bin/tempo ./cmd/tempo

      - name: Verify Tempo configuration with locked source
        env:
          CODESTRA_ENVIRONMENT: test
          CODESTRA_REGION: ci
          CODESTRA_DEPLOYMENT_ID: exact-head-ci
          TEMPO_S3_ENDPOINT: s3.internal.example:443
          TEMPO_S3_BUCKET: codestra-tempo-ci
          TEMPO_S3_REGION: us-east-1
          TEMPO_S3_INSECURE: 'false'
          TEMPO_MEMCACHED_ADDRESSES: dns+memcached:11211
          TEMPO_PROMETHEUS_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
          TEMPO_OVERRIDES_FILE: codestra/config/overrides.yaml
        run: |
          .bin/tempo \
            -config.file=codestra/config/tempo.yaml \
            -config.expand-env=true \
            -config.verify \
            -config.verify-errors-only=true

      - name: Confirm source-only safety state
        run: |
          test "$(python -c 'import json; print(json.load(open("codestra/enterprise-profile.v1.json"))["status"])')" = "CONFIG_PREPARED_NOT_DEPLOYED"
          test "$(python -c 'import json; print(json.load(open("codestra/enterprise-profile.v1.json"))["topology"]["productionApproved"])')" = "False"
          python - <<'PY'
          import json
          profile = json.load(open('codestra/enterprise-profile.v1.json', encoding='utf-8'))
          assert profile['exposure'] == 'internal_private'
          assert profile['privacy'] and all(value is False for value in profile['privacy'].values())
          PY
