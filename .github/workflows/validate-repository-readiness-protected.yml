name: Validate protected Tempo source
on:
  push: {branches: [development, test, staging, production, main]}
permissions: {contents: read}
jobs:
  validate-protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13"}
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements-validation.txt
          python3 scripts/validate_codestra_profile_privacy.py
          python3 scripts/validate_codestra_corporate_tempo.py
          python3 scripts/validate_repository_readiness.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and inspect the exact protected commit
        run: bash scripts/build_and_inspect_locked_image.sh "$GITHUB_SHA"
